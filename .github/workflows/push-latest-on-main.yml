name: Push Latest on Main

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - entrypoint.sh
      - cron.sh
      - conditional-cron.sh
      - setup-notify-push.sh
      - init-notify-push.sh
      - auto-install-apps.sh
      - supervisord.conf
      - .github/workflows/push-latest-on-main.yml

permissions:
  contents: read

env:
  IMAGE_NAME: bankaitech/nextcloud

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
