name: Push Latest on Main

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - entrypoint.sh
      - cron.sh
      - conditional-cron.sh
      - setup-notify-push.sh
      - init-notify-push.sh
      - auto-install-apps.sh
      - supervisord.conf
      - .github/workflows/push-latest-on-main.yml
      - .github/workflows/build-multiarch.yml

permissions:
  contents: read

jobs:
  build-and-push:
    uses: ./.github/workflows/build-multiarch.yml
    with:
      image_name: bankaitech/nextcloud
      tags: bankaitech/nextcloud:latest
      artifact_key: latest-on-main
    secrets: inherit
