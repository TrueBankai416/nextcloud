name: Check Missing Nextcloud Version Tags

on:
  workflow_dispatch:
    inputs:
      dockerhub_namespace:
        description: Docker Hub namespace/user
        required: true
        default: bankaitech
      dockerhub_repository:
        description: Docker Hub repository name
        required: true
        default: nextcloud
      from_version:
        description: First strict version to consider (inclusive), for example 32.0.7
        required: true
        default: "32.0.7"
      to_version:
        description: Last strict version to consider (inclusive). Use auto to use nextcloud:production NEXTCLOUD_VERSION
        required: true
        default: auto
      major_filter:
        description: Optional major to limit checks to (for example 32). Leave empty to include all majors in range
        required: false
        default: ""
      fail_on_missing:
        description: Fail the workflow if any versions are missing
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      build_and_push_missing:
        description: Build and push missing numeric versions to Docker Hub
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  BASE_IMAGE: nextcloud:production

jobs:
  check-missing-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target Nextcloud version from upstream image
        id: target
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${BASE_IMAGE}"

          nextcloud_version="$(docker image inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "${BASE_IMAGE}" | awk '$0 ~ /^NEXTCLOUD_VERSION=/ && !found { sub(/^NEXTCLOUD_VERSION=/,""); print; found=1 }')"

          if [ -z "${nextcloud_version}" ]; then
            echo "Unable to detect NEXTCLOUD_VERSION from ${BASE_IMAGE}" >&2
            exit 1
          fi

          if ! echo "${nextcloud_version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "NEXTCLOUD_VERSION is not a strict semver patch version: ${nextcloud_version}" >&2
            exit 1
          fi

          echo "target_version=${nextcloud_version}" >> "${GITHUB_OUTPUT}"
          echo "Target version: ${nextcloud_version}"

      - name: Compare Docker Hub tags and find missing patch versions
        id: compare
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.target.outputs.target_version }}
          DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub_namespace }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub_repository }}
          FROM_VERSION: ${{ inputs.from_version }}
          TO_VERSION: ${{ inputs.to_version }}
          MAJOR_FILTER: ${{ inputs.major_filter }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          target = os.environ["TARGET_VERSION"].strip()
          namespace = os.environ["DOCKERHUB_NAMESPACE"].strip()
          repository = os.environ["DOCKERHUB_REPOSITORY"].strip()
          from_version = os.environ["FROM_VERSION"].strip()
          to_version_raw = os.environ["TO_VERSION"].strip()
          major_filter_raw = os.environ["MAJOR_FILTER"].strip()

          semver_re = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")

          def parse_semver(version: str):
            m = semver_re.fullmatch(version)
            if not m:
              raise SystemExit(f"Invalid strict version format: {version}")
            return tuple(map(int, m.groups()))

          def format_semver(v):
            return f"{v[0]}.{v[1]}.{v[2]}"

          def fetch_tags(repo_namespace: str, repo_name: str):
            url = f"https://hub.docker.com/v2/repositories/{repo_namespace}/{repo_name}/tags?page_size=100"
            tags = []
            while url:
              with urllib.request.urlopen(url, timeout=30) as response:
                payload = json.load(response)
              for item in payload.get("results", []):
                tags.append(str(item.get("name", "")).strip())
              url = payload.get("next")
            return tags

          range_start = parse_semver(from_version)
          range_end = parse_semver(target if to_version_raw == "auto" else to_version_raw)

          if range_start > range_end:
            raise SystemExit(
              "from_version cannot be greater than to_version. "
              f"Got {format_semver(range_start)} > {format_semver(range_end)}"
            )

          major_filter = None
          if major_filter_raw:
            if not re.fullmatch(r"\d+", major_filter_raw):
              raise SystemExit(f"major_filter must be an integer, got: {major_filter_raw}")
            major_filter = int(major_filter_raw)

          upstream_versions = set()
          for name in fetch_tags("library", "nextcloud"):
            m = semver_re.fullmatch(name)
            if not m:
              continue
            v = tuple(map(int, m.groups()))
            if not (range_start <= v <= range_end):
              continue
            if major_filter is not None and v[0] != major_filter:
              continue
            upstream_versions.add(v)

          if not upstream_versions:
            raise SystemExit(
              "No upstream strict numeric Nextcloud tags found in selected scope. "
              "Adjust from_version/to_version/major_filter."
            )

          mirror_versions = set()
          for name in fetch_tags(namespace, repository):
            m = semver_re.fullmatch(name)
            if not m:
              continue
            mirror_versions.add(tuple(map(int, m.groups())))

          expected_versions_sorted = sorted(upstream_versions)
          present_versions = [format_semver(v) for v in expected_versions_sorted if v in mirror_versions]
          missing_versions = [format_semver(v) for v in expected_versions_sorted if v not in mirror_versions]

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as f:
            f.write(f"from_version={format_semver(range_start)}\n")
            f.write(f"to_version={format_semver(range_end)}\n")
            f.write(f"major_filter={'' if major_filter is None else major_filter}\n")
            f.write(f"expected_count={len(expected_versions_sorted)}\n")
            f.write(f"present_count={len(present_versions)}\n")
            f.write(f"missing_count={len(missing_versions)}\n")
            f.write("present_versions<<EOF\n")
            f.write("\n".join(present_versions) + "\n")
            f.write("EOF\n")
            f.write("missing_versions<<EOF\n")
            f.write("\n".join(missing_versions) + "\n")
            f.write("EOF\n")

          print(f"Checked upstream strict numeric tags from {format_semver(range_start)} to {format_semver(range_end)}")
          if major_filter is not None:
            print(f"Applied major filter: {major_filter}")
          print(f"Expected upstream versions in scope: {len(expected_versions_sorted)}")
          print(f"Present strict numeric tags: {len(present_versions)}")
          print(f"Missing strict numeric tags: {len(missing_versions)}")
          PY

      - name: Set up Docker Buildx
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0'
        uses: docker/setup-buildx-action@v3

      - name: Checkout repository for Dockerfile build context
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0'
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push missing versions
        id: build_missing
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0'
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub_namespace }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub_repository }}
          MISSING_VERSIONS: ${{ steps.compare.outputs.missing_versions }}
        run: |
          set -euo pipefail

          mapfile -t missing_versions < <(printf '%s\n' "${MISSING_VERSIONS}" | sed '/^$/d')

          built_versions=()
          failed_versions=()

          for version in "${missing_versions[@]}"; do
            image_tag="${DOCKERHUB_NAMESPACE}/${DOCKERHUB_REPOSITORY}:${version}"
            base_image="nextcloud:${version}"
            generated_dockerfile="/tmp/Dockerfile.${version}"

            echo "Preparing build for ${image_tag} using base ${base_image}"

            if ! docker pull "${base_image}"; then
              echo "Skipping ${version}: upstream base image ${base_image} was not found"
              failed_versions+=("${version}")
              continue
            fi

            awk -v replacement="FROM ${base_image}" '
              BEGIN { replaced = 0 }
              {
                if (!replaced && $1 == "FROM") {
                  print replacement
                  replaced = 1
                  next
                }
                print
              }
              END {
                if (!replaced) {
                  exit 1
                }
              }
            ' Dockerfile > "${generated_dockerfile}"

            if docker buildx build \
              --pull \
              --push \
              --file "${generated_dockerfile}" \
              --tag "${image_tag}" \
              .; then
              echo "Built and pushed ${image_tag}"
              built_versions+=("${version}")
            else
              echo "Build failed for ${image_tag}"
              failed_versions+=("${version}")
            fi
          done

          {
            echo "built_count=${#built_versions[@]}"
            echo "failed_count=${#failed_versions[@]}"
            echo "built_versions<<EOF"
            printf '%s\n' "${built_versions[@]}"
            echo "EOF"
            echo "failed_versions<<EOF"
            printf '%s\n' "${failed_versions[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Missing Nextcloud Version Tag Report"
            echo ""
            echo "- Docker Hub repository: ${{ inputs.dockerhub_namespace }}/${{ inputs.dockerhub_repository }}"
            echo "- Upstream target version: ${{ steps.target.outputs.target_version }}"
            echo "- Version range checked: ${{ steps.compare.outputs.from_version }} through ${{ steps.compare.outputs.to_version }}"
            if [ -n "${{ steps.compare.outputs.major_filter }}" ]; then
              echo "- Major filter: ${{ steps.compare.outputs.major_filter }}"
            else
              echo "- Major filter: none"
            fi
            echo "- Upstream strict versions expected in scope: ${{ steps.compare.outputs.expected_count }}"
            echo "- Present strict numeric tags: ${{ steps.compare.outputs.present_count }}"
            echo "- Missing strict numeric tags: ${{ steps.compare.outputs.missing_count }}"
            echo "- Build missing versions: ${{ inputs.build_and_push_missing }}"
            if [ "${{ inputs.build_and_push_missing }}" = "true" ] && [ "${{ steps.compare.outputs.missing_count }}" != "0" ]; then
              echo "- Built missing versions: ${{ steps.build_missing.outputs.built_count }}"
              echo "- Failed builds: ${{ steps.build_missing.outputs.failed_count }}"
            fi
            echo ""
            echo "### Missing Versions"
            if [ "${{ steps.compare.outputs.missing_count }}" = "0" ]; then
              echo "None"
            else
              echo "${{ steps.compare.outputs.missing_versions }}"
            fi
            if [ "${{ inputs.build_and_push_missing }}" = "true" ] && [ "${{ steps.compare.outputs.missing_count }}" != "0" ]; then
              echo ""
              echo "### Built Versions"
              if [ "${{ steps.build_missing.outputs.built_count }}" = "0" ]; then
                echo "None"
              else
                echo "${{ steps.build_missing.outputs.built_versions }}"
              fi
              echo ""
              echo "### Failed Version Builds"
              if [ "${{ steps.build_missing.outputs.failed_count }}" = "0" ]; then
                echo "None"
              else
                echo "${{ steps.build_missing.outputs.failed_versions }}"
              fi
            fi
            echo ""
            echo "### Present Versions"
            if [ "${{ steps.compare.outputs.present_count }}" = "0" ]; then
              echo "None"
            else
              echo "${{ steps.compare.outputs.present_versions }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail if missing versions were found
        if: inputs.fail_on_missing == 'true' && steps.compare.outputs.missing_count != '0' && inputs.build_and_push_missing != 'true'
        run: |
          echo "Missing versions detected:" >&2
          echo "${{ steps.compare.outputs.missing_versions }}" >&2
          exit 1

      - name: Fail if any missing version build failed
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0' && steps.build_missing.outputs.failed_count != '0'
        run: |
          echo "Some missing versions failed to build/push:" >&2
          echo "${{ steps.build_missing.outputs.failed_versions }}" >&2
          exit 1