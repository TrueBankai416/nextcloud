name: Check Missing Nextcloud Version Tags

on:
  workflow_dispatch:
    inputs:
      dockerhub_namespace:
        description: Docker Hub namespace/user
        required: true
        default: bankaitech
      dockerhub_repository:
        description: Docker Hub repository name
        required: true
        default: nextcloud
      start_patch:
        description: Starting patch number to check (inclusive)
        required: true
        default: "7"
      fail_on_missing:
        description: Fail the workflow if any versions are missing
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      build_and_push_missing:
        description: Build and push missing numeric versions to Docker Hub
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  BASE_IMAGE: nextcloud:production

jobs:
  check-missing-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target Nextcloud version from upstream image
        id: target
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${BASE_IMAGE}"

          nextcloud_version="$(docker image inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "${BASE_IMAGE}" | awk '$0 ~ /^NEXTCLOUD_VERSION=/ && !found { sub(/^NEXTCLOUD_VERSION=/,""); print; found=1 }')"

          if [ -z "${nextcloud_version}" ]; then
            echo "Unable to detect NEXTCLOUD_VERSION from ${BASE_IMAGE}" >&2
            exit 1
          fi

          if ! echo "${nextcloud_version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "NEXTCLOUD_VERSION is not a strict semver patch version: ${nextcloud_version}" >&2
            exit 1
          fi

          echo "target_version=${nextcloud_version}" >> "${GITHUB_OUTPUT}"
          echo "Target version: ${nextcloud_version}"

      - name: Compare Docker Hub tags and find missing patch versions
        id: compare
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.target.outputs.target_version }}
          DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub_namespace }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub_repository }}
          START_PATCH: ${{ inputs.start_patch }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          target = os.environ["TARGET_VERSION"].strip()
          namespace = os.environ["DOCKERHUB_NAMESPACE"].strip()
          repository = os.environ["DOCKERHUB_REPOSITORY"].strip()
          start_patch_raw = os.environ["START_PATCH"].strip()

          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", target)
          if not m:
              raise SystemExit(f"Invalid target version format: {target}")

          major, minor, target_patch = map(int, m.groups())

          if not re.fullmatch(r"\d+", start_patch_raw):
              raise SystemExit(f"start_patch must be a non-negative integer, got: {start_patch_raw}")

          start_patch = int(start_patch_raw)
          if start_patch > target_patch:
              raise SystemExit(
                  f"start_patch ({start_patch}) cannot be greater than target patch ({target_patch})"
              )

          url = f"https://hub.docker.com/v2/repositories/{namespace}/{repository}/tags?page_size=100"
          patch_numbers = set()

          while url:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)

              for item in payload.get("results", []):
                  name = str(item.get("name", "")).strip()
                  if not re.fullmatch(r"\d+\.\d+\.\d+", name):
                      continue

                  tag_major, tag_minor, tag_patch = map(int, name.split("."))
                  if tag_major == major and tag_minor == minor:
                      patch_numbers.add(tag_patch)

              url = payload.get("next")

          expected_patches = list(range(start_patch, target_patch + 1))
          present_versions = [f"{major}.{minor}.{p}" for p in expected_patches if p in patch_numbers]
          missing_versions = [f"{major}.{minor}.{p}" for p in expected_patches if p not in patch_numbers]

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as f:
              f.write(f"major_minor={major}.{minor}\n")
              f.write(f"target_patch={target_patch}\n")
              f.write(f"present_count={len(present_versions)}\n")
              f.write(f"missing_count={len(missing_versions)}\n")
              f.write("present_versions<<EOF\n")
              f.write("\n".join(present_versions) + "\n")
              f.write("EOF\n")
              f.write("missing_versions<<EOF\n")
              f.write("\n".join(missing_versions) + "\n")
              f.write("EOF\n")

          print(f"Checked {major}.{minor}.{start_patch} through {major}.{minor}.{target_patch}")
          print(f"Present strict numeric tags: {len(present_versions)}")
          print(f"Missing strict numeric tags: {len(missing_versions)}")
          PY

      - name: Set up Docker Buildx
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push missing versions
        id: build_missing
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0'
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub_namespace }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub_repository }}
          MISSING_VERSIONS: ${{ steps.compare.outputs.missing_versions }}
        run: |
          set -euo pipefail

          mapfile -t missing_versions < <(printf '%s\n' "${MISSING_VERSIONS}" | sed '/^$/d')

          built_versions=()
          failed_versions=()

          for version in "${missing_versions[@]}"; do
            image_tag="${DOCKERHUB_NAMESPACE}/${DOCKERHUB_REPOSITORY}:${version}"
            base_image="nextcloud:${version}"
            generated_dockerfile="/tmp/Dockerfile.${version}"

            echo "Preparing build for ${image_tag} using base ${base_image}"

            if ! docker pull "${base_image}"; then
              echo "Skipping ${version}: upstream base image ${base_image} was not found"
              failed_versions+=("${version}")
              continue
            fi

            awk -v replacement="FROM ${base_image}" '
              BEGIN { replaced = 0 }
              {
                if (!replaced && $1 == "FROM") {
                  print replacement
                  replaced = 1
                  next
                }
                print
              }
              END {
                if (!replaced) {
                  exit 1
                }
              }
            ' Dockerfile > "${generated_dockerfile}"

            if docker buildx build \
              --pull \
              --push \
              --file "${generated_dockerfile}" \
              --tag "${image_tag}" \
              .; then
              echo "Built and pushed ${image_tag}"
              built_versions+=("${version}")
            else
              echo "Build failed for ${image_tag}"
              failed_versions+=("${version}")
            fi
          done

          {
            echo "built_count=${#built_versions[@]}"
            echo "failed_count=${#failed_versions[@]}"
            echo "built_versions<<EOF"
            printf '%s\n' "${built_versions[@]}"
            echo "EOF"
            echo "failed_versions<<EOF"
            printf '%s\n' "${failed_versions[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Missing Nextcloud Version Tag Report"
            echo ""
            echo "- Docker Hub repository: ${{ inputs.dockerhub_namespace }}/${{ inputs.dockerhub_repository }}"
            echo "- Upstream target version: ${{ steps.target.outputs.target_version }}"
            echo "- Version line checked: ${{ steps.compare.outputs.major_minor }}.${{ inputs.start_patch }} through ${{ steps.compare.outputs.major_minor }}.${{ steps.compare.outputs.target_patch }}"
            echo "- Present strict numeric tags: ${{ steps.compare.outputs.present_count }}"
            echo "- Missing strict numeric tags: ${{ steps.compare.outputs.missing_count }}"
            echo "- Build missing versions: ${{ inputs.build_and_push_missing }}"
            if [ "${{ inputs.build_and_push_missing }}" = "true" ] && [ "${{ steps.compare.outputs.missing_count }}" != "0" ]; then
              echo "- Built missing versions: ${{ steps.build_missing.outputs.built_count }}"
              echo "- Failed builds: ${{ steps.build_missing.outputs.failed_count }}"
            fi
            echo ""
            echo "### Missing Versions"
            if [ "${{ steps.compare.outputs.missing_count }}" = "0" ]; then
              echo "None"
            else
              echo "${{ steps.compare.outputs.missing_versions }}"
            fi
            if [ "${{ inputs.build_and_push_missing }}" = "true" ] && [ "${{ steps.compare.outputs.missing_count }}" != "0" ]; then
              echo ""
              echo "### Built Versions"
              if [ "${{ steps.build_missing.outputs.built_count }}" = "0" ]; then
                echo "None"
              else
                echo "${{ steps.build_missing.outputs.built_versions }}"
              fi
              echo ""
              echo "### Failed Version Builds"
              if [ "${{ steps.build_missing.outputs.failed_count }}" = "0" ]; then
                echo "None"
              else
                echo "${{ steps.build_missing.outputs.failed_versions }}"
              fi
            fi
            echo ""
            echo "### Present Versions"
            if [ "${{ steps.compare.outputs.present_count }}" = "0" ]; then
              echo "None"
            else
              echo "${{ steps.compare.outputs.present_versions }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail if missing versions were found
        if: inputs.fail_on_missing == 'true' && steps.compare.outputs.missing_count != '0' && inputs.build_and_push_missing != 'true'
        run: |
          echo "Missing versions detected:" >&2
          echo "${{ steps.compare.outputs.missing_versions }}" >&2
          exit 1

      - name: Fail if any missing version build failed
        if: inputs.build_and_push_missing == 'true' && steps.compare.outputs.missing_count != '0' && steps.build_missing.outputs.failed_count != '0'
        run: |
          echo "Some missing versions failed to build/push:" >&2
          echo "${{ steps.build_missing.outputs.failed_versions }}" >&2
          exit 1