name: Build and Publish Nextcloud Image

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dockerhub-auto-build.yml
      - .github/workflows/build-multiarch.yml
      - Dockerfile
      - docker-entrypoint.sh
      - entrypoint.sh
      - cron.sh
      - conditional-cron.sh
      - setup-notify-push.sh
      - init-notify-push.sh
      - auto-install-apps.sh
      - supervisord.conf

permissions:
  contents: read

env:
  IMAGE_NAME: bankaitech/nextcloud
  BASE_IMAGE: nextcloud:production

concurrency:
  group: dockerhub-auto-build-publish
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      base_digest: ${{ steps.upstream.outputs.base_digest }}
      version_tag: ${{ steps.upstream.outputs.version_tag }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read upstream image digest and version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${BASE_IMAGE}"

          base_digest="$(docker image inspect --format='{{ index .RepoDigests 0 }}' "${BASE_IMAGE}" | awk -F'@' '{print $2}')"
          base_version="$(docker image inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "${BASE_IMAGE}" | awk '$0 ~ /^NEXTCLOUD_VERSION=/ && !found { sub(/^NEXTCLOUD_VERSION=/,""); print; found=1 }')"

          if [ -z "${base_version}" ] || [ "${base_version}" = "<no value>" ]; then
            base_version="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.version" }}' "${BASE_IMAGE}" || true)"
          fi

          if [ -z "${base_version}" ] || [ "${base_version}" = "<no value>" ]; then
            base_version="$(docker image inspect --format='{{ index .Config.Labels "org.label-schema.version" }}' "${BASE_IMAGE}" || true)"
          fi

          if [ -z "${base_version}" ] || [ "${base_version}" = "<no value>" ]; then
            base_version="$(date -u +%Y.%m.%d)"
          fi

          safe_version="$(echo "${base_version}" | tr '/:@ ' '-' | tr -cd 'A-Za-z0-9._-')"
          safe_version="$(printf '%s' "${safe_version}" | sed 's/^[.-]\+//')"
          safe_version="${safe_version:0:128}"

          if [ -z "${safe_version}" ]; then
            safe_version="$(date -u +%Y.%m.%d)"
          fi

          echo "base_digest=${base_digest}" >> "${GITHUB_OUTPUT}"
          echo "version_tag=${safe_version}" >> "${GITHUB_OUTPUT}"

          echo "Upstream digest: ${base_digest}"
          echo "Version tag: ${safe_version}"

      - name: Check if rebuild is required
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if ! docker pull "${IMAGE_NAME}:latest" >/tmp/docker_pull_latest.log 2>&1; then
            echo "No latest image found (or not pullable), forcing build."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          previous_base_digest="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "${IMAGE_NAME}:latest" || true)"

          if [ -z "${previous_base_digest}" ] || [ "${previous_base_digest}" = "<no value>" ]; then
            echo "Latest image has no base digest label, forcing build."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${previous_base_digest}" != "${{ steps.upstream.outputs.base_digest }}" ]; then
            echo "Base image changed (${previous_base_digest} -> ${{ steps.upstream.outputs.base_digest }}), building."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Digest is current, but tags published before multi-arch support
          # only contain amd64 and must be rebuilt once.
          for tag in latest "${{ steps.upstream.outputs.version_tag }}"; do
            if ! docker buildx imagetools inspect --raw "${IMAGE_NAME}:${tag}" 2>/dev/null \
              | jq -e '[.manifests[]?.platform.architecture] | index("arm64") != null' >/dev/null; then
              echo "${IMAGE_NAME}:${tag} is missing or not multi-arch, building."
              echo "should_build=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done

          echo "Base image digest unchanged and tags are multi-arch, skipping build."
          echo "should_build=false" >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        id: meta
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream.outputs.version_tag }}

      - name: No changes detected
        if: steps.gate.outputs.should_build != 'true'
        run: echo "No upstream change detected. Image build skipped."

      - name: Notify Discord of failure
        if: failure()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set, skipping notification."
            exit 0
          fi

          payload="$(jq -n \
            --arg content "❌ **${IMAGE_NAME}** auto-build workflow failed. Run: ${RUN_URL}" \
            '{content: $content}')"

          curl -sf -H "Content-Type: application/json" -X POST -d "${payload}" "${DISCORD_WEBHOOK_URL}"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build-multiarch.yml
    with:
      image_name: bankaitech/nextcloud
      tags: ${{ needs.check.outputs.tags }}
      labels: ${{ needs.check.outputs.labels }}
      base_image: nextcloud:production
      base_digest: ${{ needs.check.outputs.base_digest }}
      artifact_key: auto-build
      success_message: "${{ format('✅ **bankaitech/nextcloud** rebuilt (linux/amd64, linux/arm64) — upstream `nextcloud:production` changed (new digest `{0}`). Published tags: `latest`, `{1}`.', needs.check.outputs.base_digest, needs.check.outputs.version_tag) }}"
      failure_message: "❌ **bankaitech/nextcloud** auto-build workflow failed."
    secrets: inherit