version: '3.8'

services:
  nextcloud:
    build: .
    # Or use: image: your-registry/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
      - "7867:7867"  # notify_push WebSocket port
    volumes:
      - nextcloud_data:/var/www/html
      - ./custom_apps:/var/www/html/custom_apps
      - ./config:/var/www/html/config
      - ./data:/var/www/html/data
      - ./themes:/var/www/html/themes
    environment:
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=secure_admin_password
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud.local
      - NEXTCLOUD_UPDATE=1
      
      # Database configuration
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=secure_db_password
      
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_HOST_PORT=6379
      
      # notify_push configuration
      - PORT=7867
      
      # Performance tuning
      - PHP_MEMORY_LIMIT=1024M
      - PHP_UPLOAD_LIMIT=2048M
      
    depends_on:
      - db
      - redis
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mariadb:10.11
    container_name: nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-file-per-table=1 --skip-innodb-read-only-compressed
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=secure_root_password
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=secure_db_password
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: nextcloud_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Nginx reverse proxy for HTTPS and notify_push WebSocket handling
  nginx:
    image: nginx:alpine
    container_name: nextcloud_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nextcloud_data:/var/www/html:ro
    depends_on:
      - nextcloud
    networks:
      - nextcloud-network
    profiles:
      - with-nginx

  # Optional: Collabora Online for document editing
  collabora:
    image: collabora/code:latest
    container_name: nextcloud_collabora
    restart: unless-stopped
    ports:
      - "9980:9980"
    environment:
      - domain=nextcloud\\.local
      - username=admin
      - password=secure_collabora_password
      - DONT_GEN_SSL_CERT=1
    cap_add:
      - MKNOD
    networks:
      - nextcloud-network
    profiles:
      - with-collabora

volumes:
  nextcloud_data:
    driver: local
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  nextcloud-network:
    driver: bridge
