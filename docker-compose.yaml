name: nextcloud

services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: unless-stopped
    command: >
      --transaction-isolation=READ-COMMITTED
      --log-bin=binlog
      --binlog-format=ROW
      --log_bin_trust_function_creators=true
      --innodb-file-per-table=1
      --skip-innodb-read-only-compressed
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=1
      --innodb-flush-method=O_DIRECT
      --max-connections=200
      --thread-cache-size=50
      --query-cache-type=1
      --query-cache-size=256M
      --sort-buffer-size=2M
      --read-buffer-size=2M
      --read-rnd-buffer-size=8M
      --myisam-sort-buffer-size=128M
      --table-open-cache=2000
      --tmp-table-size=256M
      --max-heap-table-size=256M
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2
    volumes:
      - ${DB_DATA_LOCATION:-db_data}:/var/lib/mysql
      - db_logs:/var/log/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    env_file:
      - .env
    networks:
      - nextcloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nextcloud:
    build: .
    # Enhanced image with notify_push, memories, and recognize support
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
      - "${NOTIFY_PUSH_PORT:-7867}:7867"  # notify_push WebSocket port
    volumes:
      - ${DATA_LOCATION:-nextcloud_data}:/var/www/html
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Enhanced environment variables for better performance
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1024M}
      - PHP_UPLOAD_LIMIT=${PHP_UPLOAD_LIMIT:-2048M}
      - PHP_MAX_EXECUTION_TIME=3600
      - PHP_MAX_INPUT_TIME=3600
      - NEXTCLOUD_INIT_HTACCESS=1
      - APACHE_DISABLE_REWRITE_IP=1
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - APACHE_LOG_DIR=/var/log/apache2
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextcloud
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
#    runtime: nvidia
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]

  cron:
    build: .
    container_name: cron
    restart: unless-stopped
    networks:
      - nextcloud
    volumes:
      - ${DATA_LOCATION:-nextcloud_data}:/var/www/html:z
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: /cron.sh
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 300
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          size: 1073741824 # 1GB
      - /etc/localtime:/etc/localtime:ro
    expose:
      - 6379
    networks:
      - nextcloud
    environment:
      - REDIS_REPLICATION_MODE=master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  collabora:
    container_name: collabora
    hostname: collabora
    image: collabora/code:latest
    restart: unless-stopped
    privileged: true
    tty: true
    # Only expose port if not using nginx proxy
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    cap_add:
      - MKNOD
    volumes:
#      - ./collabora/config/coolwsd.xml:/etc/coolwsd/coolwsd.xml
      - ./collabora/fonts:/usr/share/fonts/truetype/more/
      - ./collabora/fonts:/opt/cool/systemplate/usr/share/fonts/truetype/more/
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DONT_GEN_SSL_CERT=1
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:admin_console.enable=false
      - dictionaries=en_US
      # Use the same domain as Nextcloud - this allows internal routing
      - domain=${NEXTCLOUD_DOMAIN:-localhost}
      - aliasgroup1=https://${NEXTCLOUD_DOMAIN:-localhost}:443
      - aliasgroup2=http://${NEXTCLOUD_DOMAIN:-localhost}:${PORT:-8080}
      - server_name=${NEXTCLOUD_DOMAIN:-localhost}
      - username=${COLLABORA_USERNAME:-admin}
      - password=${COLLABORA_PASSWORD:-change_me_collabora_password}
    env_file:
      - .env
    networks:
      - nextcloud
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9980/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - with-collabora

  go-vod:
    image: radialapps/go-vod
    restart: unless-stopped
    container_name: go-vod
    env_file:
      - .env
    volumes:
      - ${DATA_LOCATION:-nextcloud_data}:/var/www/html:ro
      - /etc/localtime:/etc/localtime:ro
#    runtime: nvidia # (NVENC)
    networks:
      - nextcloud
    depends_on:
      - nextcloud
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - with-govod

  # Optional: OnlyOffice Document Server (alternative to Collabora)
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    ports:
      - "${ONLYOFFICE_PORT:-8000}:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - /etc/localtime:/etc/localtime:ro
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change_me_jwt_secret}
      - WOPI_ENABLED=true
    networks:
      - nextcloud
    profiles:
      - with-onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx reverse proxy for internal service routing
  # This nginx handles internal routing between Nextcloud, Collabora, and notify_push
  # For external access, configure your host nginx to proxy to port 11000
  nginx:
    image: nginx:alpine
    container_name: nextcloud_nginx
    restart: unless-stopped
    ports:
      # Expose only on localhost for external nginx to proxy to
      - "127.0.0.1:${NGINX_INTERNAL_PORT:-11000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_LOCATION:-nextcloud_data}:/var/www/html:ro
      - nginx_logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NGINX_HOST=${NGINX_HOST:-localhost}
      - NGINX_PORT=80
    depends_on:
      nextcloud:
        condition: service_healthy
    networks:
      - nextcloud
    profiles:
      - with-nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Alternative: Direct external access nginx (use only if no external nginx)
  nginx-external:
    image: nginx:alpine
    container_name: nextcloud_nginx_external
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT_NGINX:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ${DATA_LOCATION:-nextcloud_data}:/var/www/html:ro
      - nginx_logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NGINX_HOST=${NGINX_HOST:-localhost}
      - NGINX_PORT=80
    depends_on:
      nextcloud:
        condition: service_healthy
    networks:
      - nextcloud
    profiles:
      - with-nginx-external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Backup service
  backup:
    image: offen/docker-volume-backup:latest
    container_name: nextcloud_backup
    restart: unless-stopped
    volumes:
      - ${DATA_LOCATION:-nextcloud_data}:/backup/nextcloud_data:ro
      - ${DB_DATA_LOCATION:-db_data}:/backup/db_data:ro
      - ./backups:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - BACKUP_FILENAME=nextcloud-backup-%Y%m%d-%H%M%S.tar.gz
      - BACKUP_CRON_EXPRESSION=${BACKUP_CRON_EXPRESSION:-0 2 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_STOP_DURING_BACKUP_LABEL=nextcloud.backup.stop-during-backup
    networks:
      - nextcloud
    profiles:
      - with-backup
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
    driver: local
  db_logs:
    driver: local
  nextcloud_data:
    driver: local
  nginx_logs:
    driver: local
  onlyoffice_data:
    driver: local
  onlyoffice_logs:
    driver: local

networks:
  nextcloud:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.20.0.0/16}
    driver_opts:
      com.docker.network.bridge.name: nextcloud-br
      com.docker.network.driver.mtu: 1500
